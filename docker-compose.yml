services:
  sci-backend:
    platform: linux/amd64
    build:
      context: ../..  # Temporary: allows COPY of coma-sci-backend (will use git clone later)
      dockerfile: COMA/coma-engine/backend/Dockerfile
    image: sci-backend:latest
    container_name: sci-backend
    hostname: sci-backend
    ports:
      - 5054:5054
    environment:
      - VIZQUERY_PROGRAM=${VIZQUERY_PROGRAM}
      - VIZQUERY_SITE=${VIZQUERY_SITE}
      - COMA_SERVER_HOST=${COMA_SERVER_HOST}
      - TERAPIX_DIRECTORY=${TERAPIX_DIRECTORY}
      - COMA_PORT=5054
      - COMA_DATA_DIR=/data
      - COMA_CACHE_DIR=/data/support/sci-backend/cache
      - COMA_WORK_DIR=/data/support/sci-backend/work
      - LD_LIBRARY_PATH=/usr/local/lib
    volumes:
      # Data volumes for runtime data (not in git)
      # Read-only reference data
      - ./data/support/sci-backend/catalogs:/data/support/sci-backend/catalogs:ro
      - ./data/support/sci-backend/config:/data/support/sci-backend/config:ro
      # sci-backend working directories (read-write)
      - ./data/support/sci-backend/cache:/data/support/sci-backend/cache
      - ./data/support/sci-backend/orbits:/data/support/sci-backend/orbits
      - ./data/support/sci-backend/work:/data/support/sci-backend/work
      # NOTE: .cache volume mount removed - container needs build-time compiled libraries in /root/.cache
      # - ./.cache:/root/.cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: /usr/local/bin/coma-json-server

networks:
  coma-sci_backend:
    driver: bridge

